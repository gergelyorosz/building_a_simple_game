<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5c400">
  <title>Bridge Sprint</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .rotate {
      display: none;
      color: #bbb;
      font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 0 16px;
    }
    @media (orientation: portrait) and (max-width: 700px) {
      .rotate { display: block; }
    }
    canvas {
      display: block;
      background: #222;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Bridge Sprint: ride tram 4/6 and run to BME before class starts"></canvas>
  <p class="rotate">Turn your phone sideways for a bigger view 🔄</p>
  <script src="game.js"></script>
</body>
</html>
