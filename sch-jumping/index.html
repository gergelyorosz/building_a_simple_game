<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCH Jumping</title>
<style>
  :root {
    --bg: #070b18;
    --fg: #f4f6ff;
    --btn: rgba(255, 255, 255, 0.16);
    --btn-border: rgba(255, 255, 255, 0.55);
    --act: rgba(255, 204, 51, 0.38);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #070b18; --fg: #f4f6ff; }
  }
  :root[data-theme="dark"] { --bg: #070b18; --fg: #f4f6ff; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; outline: none; }
  #touch {
    position: fixed; left: 0; right: 0; bottom: 0; display: none;
    justify-content: space-between; align-items: flex-end;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom)); pointer-events: none;
  }
  body.touch #touch { display: flex; }
  #touch .steer { display: flex; gap: 14px; }
  #touch button {
    pointer-events: auto; width: 68px; height: 68px; border-radius: 50%;
    background: var(--btn); border: 2px solid var(--btn-border); color: #fff;
    font-size: 26px; font-weight: 700; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #touch button.act { width: 92px; height: 92px; background: var(--act); font-size: 15px; letter-spacing: .5px; }
  #touch button.on { background: rgba(255, 255, 255, 0.4); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="SCH Jumping game"></canvas></div>
<div id="touch">
  <div class="steer">
    <button id="btnL" aria-label="Steer left">◀</button>
    <button id="btnR" aria-label="Steer right">▶</button>
  </div>
  <button id="btnA" class="act" aria-label="Action">JUMP</button>
</div>
<script>
'use strict';
// =====================================================================
//  SCH JUMPING — base jumping from the roof of the Schönherz Kollégium
// =====================================================================

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 960, H = 600;
let scale = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cvs.style.width = W * scale + 'px';
  cvs.style.height = H * scale + 'px';
  cvs.width = Math.round(W * scale * dpr);
  cvs.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize);
resize();

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (e) { /* storage unavailable */ }
  return null;
}

// ---------- world constants ----------
const PXM = 20;             // pixels per metre
const G = 300;              // gravity (px/s^2) — scaled for gameplay
const VT = 640;             // terminal free-fall speed (px/s)
const VC = 90;              // canopy descent speed (px/s)
const BLD_L = 80, BLD_R = 600;
const GF_H = 90, FLOOR_H = 64, FLOORS = 18, COLS = 16;
const CW = (BLD_R - BLD_L) / COLS;
const ROOF_H = GF_H + FLOORS * FLOOR_H;   // ~62 m, like the real 18-storey tower
const WORLD_W = 1700;
const EDGE_X = BLD_R - 12;

const SURF = [
  { x0: BLD_R, x1: 690, type: 'sidewalk' },
  { x0: 690, x1: 1220, type: 'lawn' },
  { x0: 1220, x1: 1250, type: 'sidewalk' },
  { x0: 1250, x1: 1400, type: 'road' },
  { x0: 1400, x1: WORLD_W, type: 'sidewalk' },
];
const TREES = [{ x: 715, trunk: 46, r: 30 }, { x: 1180, trunk: 60, r: 40 }];

const LEVELS = [
  { name: 'Gólyahét', en: "Freshers' week", sky: ['#5aa9f5', '#d4ecff'], land: '#6fae4a', wind: 12, gust: 8, tx: 870, tr: 95, throwEvery: 3.2, credits: 6, sun: [780, 110, '#fff6c8'] },
  { name: 'ZH-hét', en: 'Midterm week', sky: ['#2f86dc', '#a9d6ff'], land: '#63a544', wind: 28, gust: 12, tx: 990, tr: 82, throwEvery: 2.2, credits: 7, sun: [620, 70, '#fffbe0'] },
  { name: 'Vizsgaidőszak', en: 'Exam season', sky: ['#6d7885', '#c9d0d8'], land: '#5b8f47', wind: -30, gust: 15, tx: 800, tr: 70, throwEvery: 1.6, credits: 8, gloom: true },
  { name: 'Schönherz Qpa', en: 'Party week · Mátrix night', sky: ['#03050f', '#1b1f4a'], land: '#2f4a2c', wind: 40, gust: 18, tx: 1060, tr: 60, throwEvery: 1.1, credits: 9, night: true, matrix: true, moon: [760, 90] },
  { name: 'Diplomaosztó', en: 'Graduation day', sky: ['#e9774f', '#ffd29a'], land: '#6a9a45', wind: -42, gust: 22, tx: 920, tr: 50, throwEvery: 1.3, credits: 10, sun: [820, 380, '#fff0c0'] },
];

const STUDENTS = [
  { name: 'Bence', major: 'Electrical Eng.', quote: '"Zárthelyi? Majd holnap."', hoodie: '#e63946', hair: '#3b2416', skin: '#f1c7a5', canopy: ['#e63946', '#fdf0d5'] },
  { name: 'Dóra', major: 'Computer Eng.', quote: '"It works on my canopy."', hoodie: '#2a9d8f', hair: '#c77d3a', skin: '#f6d2b8', long: true, canopy: ['#2a9d8f', '#f4d35e'] },
  { name: 'Máté', major: 'Mechatronics', quote: '"Hajrá, tizennyolcadik!"', hoodie: '#f4a261', hair: '#141414', skin: '#d9a37c', canopy: ['#f4a261', '#264653'] },
  { name: 'Réka', major: 'Business Info.', quote: '"ROI of this jump: high."', hoodie: '#7b2cbf', hair: '#1c1c1c', skin: '#9a6a4c', long: true, canopy: ['#7b2cbf', '#ffffff'] },
];

const HAIRS = ['#1c1c1c', '#3b2416', '#6b4423', '#c77d3a', '#e8c170', '#8a3b1b'];
const SKINS = ['#f6d2b8', '#f1c7a5', '#d9a37c', '#b07a55', '#8d5b3e'];
const SHIRTS = ['#e63946', '#457b9d', '#2a9d8f', '#f4a261', '#8338ec', '#ffbe0b', '#3a86ff', '#fb5607', '#6c757d', '#06d6a0'];
const CHEERS = ['Hajrá!', 'Gyerünk!', 'Ez az!', 'Húzd meg!', 'SCH! SCH!', 'Nyomjad!'];

// ---------- game state ----------
let state = 'title';      // title | play | result | final
let sel = 0;              // selected student
let lvl = LEVELS[3];
let levelIdx = 0;
let runResults = [];
let best = parseInt(store('schjumping.best') || '0', 10) || 0;
let P, coins, items, warns, particles, floaters, crowd, residents, bubbles;
let throwTimer = 0, landT = 0, shake = 0, result = null, stats = null;
let camX = 150, camH = ROOF_H + 180 - H;
let gt = 0, power = 0, steer = 0;
let muted = store('schjumping.muted') === '1';
const keys = {};
const touchSteer = { l: false, r: false };

// ambient (deterministic background)
const bgRng = mulberry32(1848);
const clouds = Array.from({ length: 9 }, () => ({ x: bgRng() * 1600, y: 300 + bgRng() * 1100, s: 0.6 + bgRng() * 0.9, p: 0.25 + bgRng() * 0.3 }));
const midBlocks = [];
for (let x = -200; x < 2200;) { const w = 60 + bgRng() * 110; midBlocks.push({ x, w, h: 70 + bgRng() * 150, seed: bgRng() }); x += w + 10 + bgRng() * 30; }
const stars = Array.from({ length: 90 }, () => ({ x: bgRng() * W, y: bgRng() * H * 0.8, s: bgRng() * 1.6 + 0.3, tw: bgRng() * 6 }));
let tramX = -600;

// ---------- audio ----------
let AC = null, windGain = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    windGain = AC.createGain(); windGain.gain.value = 0;
    src.connect(lp); lp.connect(windGain); windGain.connect(AC.destination); src.start();
  } catch (e) { AC = null; }
}
function blip(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq, q = 1, vol = 0.2) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  jump: () => blip(300, 0.25, 'triangle', 0.12, 400),
  pop: () => { noise(0.25, 900, 0.8, 0.35); blip(160, 0.15, 'sine', 0.15, -60); },
  coin: () => { blip(988, 0.08, 'square', 0.06); setTimeout(() => blip(1319, 0.14, 'square', 0.06), 70); },
  hit: () => { blip(180, 0.2, 'sawtooth', 0.1, -120); noise(0.12, 500, 1, 0.15); },
  thud: () => { blip(110, 0.2, 'sine', 0.25, -50); noise(0.15, 200, 0.7, 0.25); },
  crash: () => { noise(0.8, 150, 0.5, 0.5); blip(90, 0.6, 'sawtooth', 0.12, -60); },
  cheer: () => { noise(1.4, 1600, 0.6, 0.18); noise(1.1, 2600, 0.8, 0.1); for (let i = 0; i < 5; i++) setTimeout(() => blip(700 + Math.random() * 600, 0.08, 'triangle', 0.04), i * 140); },
  beep: () => blip(1200, 0.06, 'square', 0.05),
  honk: () => { blip(420, 0.35, 'square', 0.08); blip(520, 0.35, 'square', 0.06); },
};

// ---------- level setup ----------
function windNow() {
  return lvl.wind + Math.sin(gt * 0.8) * lvl.gust * 0.6 + Math.sin(gt * 2.3 + 1) * lvl.gust * 0.4;
}
function surfaceAt(x) {
  for (const s of SURF) if (x >= s.x0 && x < s.x1) return s.type;
  return 'sidewalk';
}
function randomPerson(extra) {
  return Object.assign({ hair: pick(HAIRS), skin: pick(SKINS), hoodie: pick(SHIRTS), long: Math.random() < 0.45 }, extra);
}
function makeResidents() {
  const r = new Map();
  for (let row = 0; row < FLOORS; row++) for (let c = 0; c < COLS; c++)
    if (Math.random() < 0.11) r.set(row * COLS + c, randomPerson({ phase: Math.random() * 6 }));
  return r;
}
function makeCrowd(L) {
  const out = [];
  let tries = 0;
  while (out.length < 7 && tries++ < 300) {
    const x = rand(700, 1210);
    if (Math.abs(x - L.tx) < L.tr + 22) continue;
    if (TREES.some(t => Math.abs(t.x - x) < 14)) continue;
    if (out.some(o => Math.abs(o.x - x) < 22)) continue;
    out.push(randomPerson({ x, phase: Math.random() * 6, mood: 'idle', jumpT: 0 }));
  }
  return out;
}
function makeCoins(L) {
  const n = L.credits, out = [];
  for (let i = 0; i < n; i++) {
    const f = (i + 0.5) / n;
    out.push({ x: clamp(lerp(700, L.tx, f) + rand(-110, 110), 650, 1400), h: ROOF_H - 170 - f * (ROOF_H - 330), got: false, ph: Math.random() * 6 });
  }
  return out;
}
function startLevel(i) {
  levelIdx = i; lvl = LEVELS[i];
  P = { x: EDGE_X, h: ROOF_H, vx: 0, vd: 0, phase: 'ready', t: 0, deployT: 0, flareT: 0, flared: false, stallT: 0, rot: 0, spin: 0, openAlt: null, beepT: 0 };
  coins = makeCoins(lvl); items = []; warns = []; particles = []; floaters = []; bubbles = [];
  crowd = makeCrowd(lvl); residents = makeResidents();
  throwTimer = lvl.throwEvery + 1.5; landT = 0; shake = 0; result = null;
  stats = { coins: 0, hits: 0 };
  camX = clamp(P.x - W * 0.45, 0, WORLD_W - W); camH = clamp(P.h - H * 0.62, -70, ROOF_H + 180 - H);
  state = 'play';
  updateActionLabel();
}
function goTitle() {
  state = 'title'; lvl = LEVELS[3];
  P = { x: EDGE_X, h: ROOF_H, vx: 0, vd: 0, phase: 'ready', t: 0, rot: 0, spin: 0 };
  coins = []; items = []; warns = []; particles = []; floaters = []; bubbles = [];
  crowd = makeCrowd(lvl); residents = makeResidents();
  camX = 150; camH = ROOF_H + 180 - H;
  updateActionLabel();
}

// ---------- input ----------
function action() {
  initAudio();
  if (state === 'title') { runResults = []; startLevel(0); return; }
  if (state === 'result') {
    if (levelIdx < LEVELS.length - 1) startLevel(levelIdx + 1);
    else finishRun();
    return;
  }
  if (state === 'final') { goTitle(); return; }
  if (state !== 'play') return;
  if (P.phase === 'ready') doJump();
  else if (P.phase === 'free') deploy();
  else if (P.phase === 'canopy' && !P.flared) { P.flared = true; P.flareT = 1.2; blip(500, 0.15, 'triangle', 0.06, -200); }
  updateActionLabel();
}
function updateActionLabel() {
  const b = document.getElementById('btnA');
  let t = 'GO';
  if (state === 'play') t = { ready: 'JUMP', free: 'OPEN', deploy: 'OPEN', canopy: 'FLARE', done: '…' }[P.phase] || 'GO';
  else if (state === 'title') t = 'START';
  else if (state === 'result') t = 'NEXT';
  else if (state === 'final') t = 'AGAIN';
  b.textContent = t;
}
function doJump() {
  P.phase = 'free'; P.t = 0;
  P.vx = 40 + 130 * power; P.vd = -150;
  sfx.jump();
  floater(P.x, P.h + 50, power > 0.85 ? 'Great exit!' : power < 0.3 ? 'Weak exit…' : 'Go!', '#fff');
}
function deploy() {
  P.phase = 'deploy'; P.deployT = 0; P.openAlt = P.h;
  P.vx += rand(-25, 25);
  sfx.pop();
}
addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'Enter' || k.startsWith('Arrow')) e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  if (state === 'title') {
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { sel = (sel + STUDENTS.length - 1) % STUDENTS.length; sfx.beep(); initAudio(); }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { sel = (sel + 1) % STUDENTS.length; sfx.beep(); initAudio(); }
  }
  if (k === ' ' || k === 'Enter') action();
  if (k === 'm' || k === 'M') toggleMute();
  if (k === 'Escape') goTitle();
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchSteer.l = touchSteer.r = false; });
function toggleMute() { muted = !muted; store('schjumping.muted', muted ? '1' : '0'); if (windGain) windGain.gain.value = 0; }

function toLogical(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const MUTE_BTN = { x: 906, y: H - 44, w: 38, h: 30 };
function cardRect(i) { return { x: 110 + i * 190, y: 250, w: 170, h: 170 }; }
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  cvs.focus();
  if (e.pointerType === 'touch') document.body.classList.add('touch');
  const p = toLogical(e);
  if (p.x >= MUTE_BTN.x && p.x <= MUTE_BTN.x + MUTE_BTN.w && p.y >= MUTE_BTN.y && p.y <= MUTE_BTN.y + MUTE_BTN.h) { initAudio(); toggleMute(); return; }
  if (state === 'title') {
    for (let i = 0; i < STUDENTS.length; i++) {
      const c = cardRect(i);
      if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) {
        initAudio();
        if (sel === i) action(); else { sel = i; sfx.beep(); }
        return;
      }
    }
  }
  action();
});
function holdButton(id, on, off) {
  const b = document.getElementById(id);
  const down = e => { e.preventDefault(); b.classList.add('on'); on(); };
  const up = e => { e.preventDefault(); b.classList.remove('on'); off(); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
}
holdButton('btnL', () => {
  touchSteer.l = true;
  if (state === 'title') { sel = (sel + STUDENTS.length - 1) % STUDENTS.length; initAudio(); sfx.beep(); }
}, () => { touchSteer.l = false; });
holdButton('btnR', () => {
  touchSteer.r = true;
  if (state === 'title') { sel = (sel + 1) % STUDENTS.length; initAudio(); sfx.beep(); }
}, () => { touchSteer.r = false; });
holdButton('btnA', () => action(), () => {});
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');

// ---------- effects ----------
function floater(x, h, text, color, size = 18) { floaters.push({ x, h, text, color, size, life: 1.4 }); }
function burst(x, h, n, colors, speed = 160, g = 300) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * speed;
    particles.push({ x, h, vx: Math.cos(a) * s, vh: Math.sin(a) * s + speed * 0.4, life: rand(0.6, 1.4), max: 1.4, c: pick(colors), size: rand(2, 5), g });
  }
}

// ---------- update ----------
function update(dt) {
  gt += dt;
  const w = lvl ? windNow() : 0;
  for (const c of clouds) { c.x += (w * 0.6 + 6) * dt * c.s; if (c.x > 1800) c.x -= 2000; if (c.x < -200) c.x += 2000; }
  tramX += 90 * dt; if (tramX > 2600) tramX = -900;

  for (const p of particles) { p.vh -= p.g * dt; p.x += p.vx * dt; p.h += p.vh * dt; p.life -= dt; if (p.h < 0 && p.g > 0) { p.h = 0; p.vh *= -0.3; p.vx *= 0.6; } }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.h += 40 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
  for (const b of bubbles) b.life -= dt;
  bubbles = bubbles.filter(b => b.life > 0);
  for (const c of crowd) {
    if (c.jumpT > 0) c.jumpT -= dt;
    if (state === 'play' && P.phase !== 'done' && P.phase !== 'ready' && P.h < 700 && Math.random() < dt * 0.25 && bubbles.length < 3)
      bubbles.push({ who: c, text: pick(CHEERS), life: 1.6 });
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 2.5);

  if (state === 'title') { P.t += dt; return; }
  if (state !== 'play' && state !== 'result') return;

  steer = ((keys.ArrowRight || keys.d || keys.D || touchSteer.r) ? 1 : 0) - ((keys.ArrowLeft || keys.a || keys.A || touchSteer.l) ? 1 : 0);
  P.t += dt;

  if (P.phase === 'ready') {
    power = (Math.sin(P.t * 3.4 - Math.PI / 2) + 1) / 2;
  } else if (P.phase === 'free' || P.phase === 'deploy' || P.phase === 'canopy') {
    physics(dt, w);
    throwing(dt);
  } else if (P.phase === 'done') {
    landT += dt;
    if (landT > 1.6 && state === 'play') { state = 'result'; updateActionLabel(); }
  }

  for (const it of items) {
    it.vh -= it.g * dt; it.x += it.vx * dt; it.h += it.vh * dt; it.rot += it.spin * dt;
  }
  items = items.filter(it => it.h > -20 && it.x < WORLD_W + 50);
  for (const wn of warns) wn.t -= dt;
  for (const wn of warns) if (wn.t <= 0 && !wn.fired) { wn.fired = true; spawnItem(wn); }
  warns = warns.filter(wn => wn.t > -0.8);

  // camera
  const tcx = clamp(P.x - W * 0.45, 0, WORLD_W - W);
  const tch = clamp(P.h - H * 0.62, -70, ROOF_H + 180 - H);
  camX = lerp(camX, tcx, Math.min(1, dt * 4));
  camH = lerp(camH, tch, Math.min(1, dt * 6));

  // wind audio
  if (windGain && AC) {
    const target = muted ? 0 : (P.phase === 'free' || P.phase === 'deploy') ? clamp(Math.abs(P.vd) / VT, 0, 1) * 0.35 : P.phase === 'canopy' ? 0.04 : 0;
    windGain.gain.value = lerp(windGain.gain.value, target, Math.min(1, dt * 5));
  }
}

function physics(dt, w) {
  if (P.phase === 'free') {
    P.vd += (G - G * (P.vd * Math.abs(P.vd)) / (VT * VT)) * dt;

    P.rot = lerp(P.rot, clamp(P.vx / 900, -0.35, 0.35), dt * 3);

    P.vx += (w + steer * 60 - P.vx) * 0.8 * dt;
    P.rot = lerp(P.rot, 0, dt * 5);

  P.x += P.vx * dt;

  for (const t of TREES) {

    }

    if (!it.hit && Math.hypot(P.x - it.x, P.h + 17 - it.h) < 22) {

      it.vx = -it.vx * 0.4; it.vh = 120; it.spin *= -2;
      P.vx += it.vx < 0 ? 50 : -50; P.spin = 0.8;
      floater(P.x, P.h + 55, it.label + ' −50', '#ff8fa3', 16);
    }

  if (P.h <= 0) { P.h = 0; land(); }
}

function throwing(dt) {
  throwTimer -= dt;
  if (throwTimer > 0 || P.h < 160) return;
  throwTimer = lvl.throwEvery * rand(0.7, 1.3);
  const rows = [];
  for (let r = 0; r < FLOORS; r++) {
    const wh = GF_H + r * FLOOR_H + FLOOR_H / 2;

}
function spawnItem(wn) {

// ---------- outcomes ----------
function freefallPoints() {
  if (P.openAlt == null) return 0;
  return Math.round(1500 * Math.pow(1 - clamp(P.openAlt / ROOF_H, 0, 1), 3));
}
function endJump(res) {

  runResults[levelIdx] = res.total;
  updateActionLabel();
}
function crash(reason, how) {
  sfx.crash(); shake = 1;
  burst(P.x, P.h + 10, 24, ['#ffffff', '#cccccc', '#ffd166'], 200);
  for (const c of crowd) c.mood = 'shock';
  P.crashHow = how;
  endJump({ kind: 'crash', title: 'OUCH!', sub: reason, lines: [['Freefall bonus', 0], ['Ambulance to Szent Imre kórház', 0]], total: 0 });
}
function stuck(tree) {
  sfx.thud();
  P.tree = tree; P.x = clamp(P.x, tree.x - tree.r * 0.6, tree.x + tree.r * 0.6); P.h = tree.trunk + tree.r * 0.8;
  burst(P.x, P.h + 20, 16, ['#3e7b2e', '#5aa041', '#2d5e22'], 120);
  for (const c of crowd) c.mood = 'shock';
  const ff = freefallPoints(), cr = stats.coins * 50, hp = -stats.hits * 50;
  const lines = [['Freefall bonus', ff], ['Kredits collected', cr]];
  if (stats.hits) lines.push(['Hit by flying objects', hp]);
  lines.push(['Stuck in a tree — no landing points', 0]);
  endJump({ kind: 'stuck', title: 'STUCK IN A TREE', sub: 'The porter is fetching a ladder…', lines, total: Math.max(0, ff + cr + hp) });
}
function land() {
  const v = P.vd;
  if (P.phase === 'free' || v > 240) {
    return crash(P.phase === 'free' ? "You forgot to open the parachute!" : 'Opened way too low — hit the ground at ' + Math.round(v / PXM * 3.6) + ' km/h.', 'ground');
  }
  const surf = surfaceAt(P.x);
  const d = Math.abs(P.x - lvl.tx);
  const lines = [];
  const ff = freefallPoints();
  lines.push(['Freefall bonus (opened at ' + (P.openAlt / PXM).toFixed(1) + ' m)', ff]);
  let acc = 0;
  if (d <= lvl.tr) {
    acc = Math.round(800 * (1 - d / lvl.tr));
    lines.push(['Target accuracy (' + (d / PXM).toFixed(1) + ' m off)', acc]);
    if (d < lvl.tr * 0.15) { lines.push(['BULLSEYE!', 400]); acc += 400; }
  } else {
    lines.push(['Missed the target (' + (d / PXM).toFixed(1) + ' m off)', 0]);
  }
  let lq = 0, sub;
  if (v <= 60) { lq = 200; lines.push(['Perfect flare — soft landing', 200]); sub = 'Smooth as a Qpa afterparty.'; }
  else if (v <= 140) { sub = 'Solid landing.'; lines.push(['Normal landing', 0]); }
  else { lq = -150; lines.push(['Hard landing', -150]); sub = 'That knee will need some rest.'; }
  if (surf === 'road') { lq -= 200; lines.push(['Landed on Irinyi József utca!', -200]); sfx.honk(); }
  const cr = stats.coins * 50;
  if (stats.coins) lines.push(['Kredits collected (' + stats.coins + ')', cr]);
  if (stats.hits) lines.push(['Hit by flying objects (' + stats.hits + ')', -stats.hits * 50]);
  const total = Math.max(0, ff + acc + lq + cr - stats.hits * 50);
  const good = d <= lvl.tr;
  const title = d < lvl.tr * 0.15 ? 'BULLSEYE!' : good ? 'NICE LANDING!' : surf === 'road' ? 'WATCH THE TRAM!' : 'OFF TARGET';
  if (v > 140) sfx.thud(); else blip(200, 0.1, 'sine', 0.15);
  burst(P.x, 2, 14, ['#b89b72', '#8a7458', '#d8c3a0'], 90);
  if (good) {
    sfx.cheer();
    for (const c of crowd) { c.mood = 'cheer'; c.jumpT = 2; }
    burst(P.x, 40, d < lvl.tr * 0.15 ? 70 : 30, ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ffffff'], 260);
  }

}

function windsock(x, y, s, pole = -y) {
  ctx.fillStyle = '#555'; ctx.fillRect(x - 1, y, 2.5, pole);
  const w = windNow();
  const dir = Math.sign(w) || 1, str = clamp(Math.abs(w) / 50, 0.15, 1);
  const len = 34 * s, droop = (1 - str) * 22 * s;
  for (let i = 0; i < 4; i++) {
    const a0 = i / 4, a1 = (i + 1) / 4;
    const flap = Math.sin(gt * 9 + i) * 2 * str;
    ctx.fillStyle = i % 2 ? '#fff' : '#ff6b35';
    ctx.beginPath();
    ctx.moveTo(x + dir * len * a0, y + droop * a0 * a0 - 6 * s * (1 - a0 * 0.4));
    ctx.lineTo(x + dir * len * a1, y + droop * a1 * a1 - 6 * s * (1 - a1 * 0.4) + flap);
    ctx.lineTo(x + dir * len * a1, y + droop * a1 * a1 + 6 * s * (1 - a1 * 0.4) + flap);
    ctx.lineTo(x + dir * len * a0, y + droop * a0 * a0 + 6 * s * (1 - a0 * 0.4));
    ctx.fill();
  }
}
const FONT = { S: ['111', '100', '111', '001', '111'], C: ['111', '100', '100', '100', '111'], H: ['101', '101', '111', '101', '101'] };
function matrixColor(c, r) {
  const row = 15 - r;
  if (row >= 0 && row < 5) {
    const cc = c - 4;
    if (cc >= 0 && cc < 11) {
      const li = Math.floor(cc / 4), lc = cc % 4;
      if (lc < 3 && FONT['SCH'[li]][row][lc] === '1') return `hsl(${(gt * 70 + li * 90) % 360},95%,62%)`;
    }

  const v = Math.sin(c * 0.55 + gt * 3) + Math.sin(r * 0.45 - gt * 2.2);

  return '#0b1022';
}
function drawBuilding() {

function drawCanopy(x, y, open, cols) {
  // y = bottom line of canopy; open 0..1
  const w = 84 * open, hgt = 18 * open, n = 7;
  if (w < 2) return;
  for (let i = 0; i < n; i++) {
    const a0 = i / n, a1 = (i + 1) / n;
    const x0 = x - w / 2 + w * a0, x1 = x - w / 2 + w * a1;
    const arc = u => Math.sin(u * Math.PI) * 10 * open;
    ctx.fillStyle = cols[i % 2];
    ctx.beginPath();
    ctx.moveTo(x0, y - arc(a0)); ctx.lineTo(x1, y - arc(a1));
    ctx.lineTo(x1, y - arc(a1) - hgt); ctx.lineTo(x0, y - arc(a0) - hgt); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(x, y - 4 * open, w / 2, hgt * 0.9 + 5 * open, 0, Math.PI, 0); ctx.stroke();
}

  text('ALTITUDE', W - 178, 32, 11, '#9fb0ff', 800);
  text(alt.toFixed(1) + ' m', W - 178, 62, 30, danger ? (Math.sin(gt * 20) > 0 ? '#ff4d4d' : '#fff') : '#fff', 900);
  const kmh = Math.round(Math.abs(P.vd) / PXM * 3.6);

  ctx.strokeStyle = w < 0 ? '#ff9f43' : '#7bed9f'; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 3;

    panel(W / 2 - 110, 12, 220, 40);

  }

}

  ctx.beginPath(); ctx.moveTo(b.x + 9, b.y + 12); ctx.lineTo(b.x + 14, b.y + 12); ctx.lineTo(b.x + 20, b.y + 6); ctx.lineTo(b.x + 20, b.y + 24); ctx.lineTo(b.x + 14, b.y + 18); ctx.lineTo(b.x + 9, b.y + 18); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  if (muted) { ctx.beginPath(); ctx.moveTo(b.x + 24, b.y + 10); ctx.lineTo(b.x + 32, b.y + 20); ctx.moveTo(b.x + 32, b.y + 10); ctx.lineTo(b.x + 24, b.y + 20); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(b.x + 21, b.y + 15, 6, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(b.x + 21, b.y + 15, 10, -0.9, 0.9); ctx.stroke(); }
}
function drawResult() {
  const r = result; if (!r) return;
  const lines = r.lines;
  const ph = 150 + lines.length * 26;
  const px = W / 2 - 220, py = H / 2 - ph / 2;
  panel(px, py, 440, ph, 0.85);
  const col = r.kind === 'crash' ? '#ff6b6b' : r.kind === 'good' ? '#7bed9f' : '#ffd166';
  text(r.title, W / 2, py + 44, 32, col, 900, 'center');
  text(r.sub, W / 2, py + 68, 14, '#c9d3ff', 600, 'center');
  let y = py + 102;
  for (const [label, pts] of lines) {
    text(label, px + 28, y, 14, '#fff', 600);
    text((pts > 0 ? '+' : '') + pts, px + 412, y, 14, pts < 0 ? '#ff8fa3' : pts > 0 ? '#ffd166' : '#8892b0', 800, 'right');
    y += 26;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(px + 28, y - 14, 384, 1);
  text('Jump score', px + 28, y + 10, 16, '#fff', 800);
  text(String(r.total), px + 412, y + 10, 18, '#ffd166', 900, 'right');
  const last = levelIdx === LEVELS.length - 1;
  text(last ? 'SPACE / tap for final results' : 'SPACE / tap for the next jump →', W / 2, py + ph - 14, 13, '#9fb0ff', 700, 'center');
}
function drawFinal() {
  ctx.fillStyle = 'rgba(4,6,16,0.6)'; ctx.fillRect(0, 0, W, H);
  const px = W / 2 - 240, py = 70;
  panel(px, py, 480, 460, 0.9);
  text('RUN COMPLETE', W / 2, py + 50, 34, '#ffd166', 900, 'center');
  text(STUDENTS[sel].name + ' · ' + STUDENTS[sel].major, W / 2, py + 76, 14, '#c9d3ff', 600, 'center');
  let y = py + 118;
  LEVELS.forEach((L, i) => {
    text(`${i + 1}. ${L.name}`, px + 40, y, 16, '#fff', 700);
    text(L.en, px + 200, y, 13, '#8892b0', 600);
    text(String(runResults[i] || 0), px + 440, y, 16, '#ffd166', 800, 'right');
    y += 30;
  });
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(px + 40, y - 12, 400, 1);
  text('TOTAL', px + 40, y + 18, 20, '#fff', 900);
  text(String(finalTotal), px + 440, y + 18, 26, '#ffd166', 900, 'right');
  const [rank, desc] = rating(finalTotal);
  text(rank, W / 2, y + 70, 26, '#7bed9f', 900, 'center');
  text(desc, W / 2, y + 94, 14, '#c9d3ff', 600, 'center');
  text(finalNewBest ? '★ New personal best! ★' : `Best: ${best}`, W / 2, y + 124, 14, finalNewBest ? '#ffd166' : '#9fb0ff', 800, 'center');
  text('SPACE / tap to play again', W / 2, py + 446, 13, '#9fb0ff', 700, 'center');
}
function drawTitle() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(4,6,16,0.25)'); g.addColorStop(1, 'rgba(4,6,16,0.85)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = `hsl(${(gt * 60) % 360},90%,60%)`; ctx.shadowBlur = 24;
  text('SCH JUMPING', W / 2, 110, 76, '#fff', 900, 'center');
  ctx.restore();
  text('Base jumping from the roof of the Schönherz Kollégium · Budapest', W / 2, 148, 17, '#dfe6ff', 600, 'center');
  text('18 floors · 62 metres · 5 jumps · one very worried porter', W / 2, 174, 13, '#9fb0ff', 600, 'center');
  text('Choose your student', W / 2, 232, 15, '#ffd166', 800, 'center');
  STUDENTS.forEach((s, i) => {
    const c = cardRect(i), on = i === sel;
    ctx.fillStyle = on ? 'rgba(255,209,102,0.2)' : 'rgba(255,255,255,0.08)';
    roundRect(c.x, c.y, c.w, c.h, 14); ctx.fill();
    ctx.strokeStyle = on ? '#ffd166' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = on ? 3 : 1.5;
    roundRect(c.x, c.y, c.w, c.h, 14); ctx.stroke();
    drawCanopy(c.x + c.w / 2, c.y + 50, 0.8, s.canopy);
    drawPerson(c.x + c.w / 2, c.y + 104, 1.35, s, on ? 'cheer' : 'idle', gt + i);
    text(s.name, c.x + c.w / 2, c.y + 128, 18, '#fff', 900, 'center');
    text(s.major, c.x + c.w / 2, c.y + 145, 12, '#c9d3ff', 600, 'center');
    text(s.quote, c.x + c.w / 2, c.y + 161, 10, '#9fb0ff', 600, 'center');
  });
  const touch = document.body.classList.contains('touch');
  const blink = Math.sin(gt * 4) > -0.3;
  if (blink) text(touch ? 'Tap a student, tap again (or START) to jump' : '← → choose  ·  SPACE / click to start', W / 2, 468, 18, '#fff', 800, 'center');
  text('Jump off the roof, open your parachute as late as you dare, dodge flying pizza boxes,', W / 2, 510, 13, '#c9d3ff', 600, 'center');
  text('grab kredits, steer onto the target and flare just before touchdown.', W / 2, 528, 13, '#c9d3ff', 600, 'center');
  if (best) text('Best total: ' + best, W / 2, 566, 13, '#ffd166', 800, 'center');
}

// ---------- canvas utils ----------
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- main loop ----------
goTitle();
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__sch = { get state() { return state; }, get P() { return P; }, get result() { return result; }, action, startLevel };
</script>
